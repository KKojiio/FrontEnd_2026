<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de Temperatura</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <p class="title">Conversor de Temperatura</p>
            <div class="field">
                <label for="celsius">Celsius (°C)</label>
                <input id="celsius" type="number"  step="0.1" placeholder="Ex: 100">
            </div>

            <div class="field">
                <label for="fahrenheit">Fahrenheit (°F)</label>
                <input id="fahrenheit" type="number"  step="0.1" placeholder="Ex: 212">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
